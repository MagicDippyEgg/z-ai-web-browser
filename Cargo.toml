[workspace]
resolver = "2"
members = [
    "crates/browser-core",
    "crates/browser-render",
    "crates/browser-ui",
    "crates/browser-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Z Browser Project"]

[workspace.dependencies]
# Core internal crates
browser-core = { path = "crates/browser-core" }
browser-render = { path = "crates/browser-render" }
browser-ui = { path = "crates/browser-ui" }

# External dependencies
url = "2"
ureq = { version = "2", features = ["tls", "gzip"] }
boa_engine = "0.22"
ab_glyph = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
minifb = "0.27"
log = "0.4"
env_logger = "0.11"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ahash = "0.8"
smallvec = "1"
parking_lot = "0.12"
crossbeam-channel = "0.5"
unicode-segmentation = "1"
smol_str = "0.2"
webpki-roots = "0.26"
cookie = "0.18"
percent-encoding = "2"
mime = "0.3"
base64 = "0.22"
